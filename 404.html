<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080b12">
  <title>404 — RHEA Kernel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 0%, rgba(86,117,255,.16), transparent 34rem),
        #080b12;
      color: #f6f7fb;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 680px; }
    .code {
      color: #b7c7ff;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      font-size: .8rem;
    }
    h1 {
      margin: 16px 0 14px;
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: .95;
      letter-spacing: -.06em;
    }
    p {
      margin: 0 auto 30px;
      color: #a5adbd;
      font-size: 1.05rem;
    }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 11px;
      background: #f4f6ff;
      color: #0b0e15;
      text-decoration: none;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>Page not found.</h1>
    <p>The page you requested does not exist or may have moved.</p>
    <a href="/">Return to RHEA Kernel</a>
  </main>
</body>
</html>
